<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main">

    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>

      <div class="table-wrap">
        <table>
          <caption>Available Courses</caption>
          <thead>
            <tr>
              <th scope="col">Course</th>
              <th scope="col">Seats</th>
              <th scope="col">Fees</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>B.Tech CSE</td>
              <td>120</td>
              <td>₹90,000</td>
            </tr>
            <tr>
              <td>BCA</td>
              <td>60</td>
              <td>₹45,000</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading" style="position:absolute; left:-999px;">Application form</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <div class="field">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="field">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
              <option value="btech-cse">B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select>
          </div>

          <div class="field">
            <label for="statement">Statement:</label>
            <textarea id="statement" name="statement" rows="4" cols="50"></textarea>
          </div>

          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>

  </main>

  <footer>
    <small>&copy; 2026 ABC College</small>
  </footer>

</body>
</html>
