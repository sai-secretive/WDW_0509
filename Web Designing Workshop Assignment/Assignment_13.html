<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 13: Rowspan and Colspan (Timetable)</title>
 
</head>
<body>

  <table>
    <caption><strong>Weekly Timetable</strong></caption>

    <tr>
      <th>Day</th>
      <th>9-10</th>
      <th>10-11</th>
      <th>11-12</th>
    </tr>

      <tr>
      <td>Mon</td>
      <td>Maths</td>
      <td>HTML</td>
      <!-- rowspan="2": this cell merges two rows (Mon and Tue) -->
      <td rowspan="2">Web Lab</td>
    </tr>

    <tr>
      <td>Tue</td>
      <td>DBMS</td>
      <td>OS</td>
      <!-- no 4th cell here: it is covered by the Web Lab rowspan above -->
    </tr>

    

  </table>

</body>
</html>
